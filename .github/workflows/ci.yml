name: Servo SIL Verification
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -e '.[test]'
      - name: Python unit and integration tests
        run: python -m pytest -q
      - name: Compile C++ controller
        run: |
          python tools/generate_cpp_config.py
          cmake -S cpp -B build/cpp -DCMAKE_BUILD_TYPE=Release
          cmake --build build/cpp --parallel 2
          ctest --test-dir build/cpp --output-on-failure
      - name: Reproduce software-in-loop evidence and numerical comparison
        run: python tools/quality_gate.py

      - name: Run host C++ memory/undefined-behaviour sanitizers
        run: tools/verify_sanitizers.sh
